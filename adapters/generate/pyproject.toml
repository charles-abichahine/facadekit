[project]
name = "facadekit-generate"
version = "0.1.0"
description = "Brief -> facade image. One interface, three backends (cached / fal.ai / local ComfyUI)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Charles Abi Chahine", email = "charles.abi.chahine@students.iaac.net" }]

# Stdlib only. Every backend talks HTTP over urllib so that the deployed CPU
# box does not grow a dependency for a call it will usually not make.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["facadekit_generate"]
