name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install from the lockfile
        # --locked fails if uv.lock is out of date with the pyproject files,
        # so a dependency change that was not locked cannot pass CI.
        # No --all-extras: that would pull torch and OR-Tools, which are
        # pinned in the lock but deliberately not installed here.
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run ruff check packages/core adapters/generate apps/api

      - name: Test
        run: uv run pytest packages/core/tests apps/api/tests -q

      - name: Pipeline smoke test
        # Belt and braces: the CLI is the interface Charles actually uses in
        # October, so CI runs it for real and checks the artefacts exist.
        run: |
          uv run facadekit check data/catalogues/demo.json
          uv run facadekit run \
            --mask data/samples/masks/banded.png \
            --catalogue data/catalogues/demo.json \
            --out /tmp/ci-run
          test -s /tmp/ci-run/schedule.csv
          test -s /tmp/ci-run/nesting.dxf
          test -s /tmp/ci-run/panel-map.png
          test -s /tmp/ci-run/run.json

  web:
    name: web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # 22 (active LTS), not 20: vite 8 needs ^20.19 || >=22.12, Node 20
          # is end-of-life, and Vercel builds on 22 -- CI should match production.
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
